<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">How to use your lesson</title>
  <desc id="description">Four steps: read, build, test and send.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1280" height="720" rx="36" fill="url(#background)"/>
  <circle cx="1100" cy="100" r="170" fill="#99f6e4" opacity=".35"/>
  <circle cx="130" cy="650" r="210" fill="#bae6fd" opacity=".4"/>
  <text x="640" y="118" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800" fill="#0f172a">How to use your lesson</text>
  <text x="640" y="174" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" fill="#334155">Watch, read, and follow each step at your own pace.</text>
  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <g transform="translate(100 248)">
      <rect width="245" height="250" rx="28" fill="#fff" stroke="#38bdf8" stroke-width="4"/>
      <circle cx="122" cy="75" r="43" fill="#e0f2fe"/>
      <text x="122" y="91" text-anchor="middle" font-size="46">📖</text>
      <text x="122" y="155" text-anchor="middle" font-size="28" font-weight="800" fill="#0f172a">1. Read</text>
      <text x="122" y="196" text-anchor="middle" font-size="21" fill="#475569">Know your mission</text>
    </g>
    <g transform="translate(378 248)">
      <rect width="245" height="250" rx="28" fill="#fff" stroke="#a78bfa" stroke-width="4"/>
      <circle cx="122" cy="75" r="43" fill="#ede9fe"/>
      <text x="122" y="91" text-anchor="middle" font-size="46">🧩</text>
      <text x="122" y="155" text-anchor="middle" font-size="28" font-weight="800" fill="#0f172a">2. Build</text>
      <text x="122" y="196" text-anchor="middle" font-size="21" fill="#475569">One step at a time</text>
    </g>
    <g transform="translate(656 248)">
      <rect width="245" height="250" rx="28" fill="#fff" stroke="#34d399" stroke-width="4"/>
      <circle cx="122" cy="75" r="43" fill="#d1fae5"/>
      <text x="122" y="91" text-anchor="middle" font-size="46">▶️</text>
      <text x="122" y="155" text-anchor="middle" font-size="28" font-weight="800" fill="#0f172a">3. Test</text>
      <text x="122" y="196" text-anchor="middle" font-size="21" fill="#475569">Run it and improve</text>
    </g>
    <g transform="translate(934 248)">
      <rect width="245" height="250" rx="28" fill="#fff" stroke="#fb923c" stroke-width="4"/>
      <circle cx="122" cy="75" r="43" fill="#ffedd5"/>
      <text x="122" y="91" text-anchor="middle" font-size="46">📤</text>
      <text x="122" y="155" text-anchor="middle" font-size="28" font-weight="800" fill="#0f172a">4. Send</text>
      <text x="122" y="196" text-anchor="middle" font-size="21" fill="#475569">Share what you learned</text>
    </g>
  </g>
  <rect x="380" y="570" width="520" height="76" rx="38" fill="#0f766e"/>
  <text x="640" y="618" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">Captions and a transcript are included</text>
</svg>
