<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <meta name="description" content="Inclusive, hands-on AI and robotics education across Africa, built on locally fabricated kits. Join the Inclusive Robotics 2026 waitlist free — registration KES 2,000." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111827" />

    <!-- Preconnect to font origins early -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>ChipuRobo — Nurturing Practical Skills Education in Africa</title>

    <!--
      Share cards. There is no SSR here, so a scraper only ever sees this file:
      these values are the site-wide card and cannot vary per route. They
      describe the competition because that is what the site leads with and
      what schools will be sharing.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ChipuRobo" />
    <meta property="og:url" content="https://chipurobo.com/" />
    <meta property="og:title" content="ChipuRobo — Nurturing Practical Skills Education in Africa" />
    <meta property="og:description" content="Schools work the curriculum on two tracks, build one team project, and are judged at the National Showcase. Join the Inclusive Robotics 2026 waitlist free — registration KES 2,000." />
    <meta property="og:image" content="https://chipurobo.com/img/blog/inclusive.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="799" />
    <meta property="og:image:alt" content="Learners building robots at a ChipuRobo session" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ChipuRobo — Nurturing Practical Skills Education in Africa" />
    <meta name="twitter:description" content="Schools work the curriculum on two tracks, build one team project, and are judged at the National Showcase. Join the Inclusive Robotics 2026 waitlist free — registration KES 2,000." />
    <meta name="twitter:image" content="https://chipurobo.com/img/blog/inclusive.jpg" />

    <!--
      Google tag (gtag.js) — GA4 property G-BRZM039CGC.

      Google ships this as an external <script> plus an inline block. The
      inline half has been moved to /gtag-init.js because script-src has no
      'unsafe-inline' (see security-headers.js); it is loaded first so
      window.dataLayer exists before googletagmanager.com starts reading it.

      Changing the measurement ID means editing gtag-init.js, not this file.
    -->
    <script src="/gtag-init.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BRZM039CGC"></script>

    <!--
      Non-blocking Google Fonts: load with rel="preload" + onload swap
      pattern so the request doesn't block first paint. A <noscript>
      fallback ensures fonts still load when JS is disabled.

      Pixel/robotic stack:
        - Press Start 2P  → big display headings (8-bit)
        - VT323           → body & UI (terminal/CRT, very readable)
        - Share Tech Mono → secondary mono, code/terminal blocks
      Inter & DM Serif Display kept as fallbacks / legacy.
    -->
    <!--
      Loaded as a plain stylesheet rather than the preload + onload swap.
      That pattern relies on an inline event-handler attribute, which the
      Content-Security-Policy blocks — under CSP the link would stay a
      preload and the fonts would never apply. display=swap already keeps
      text visible while they load.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700;800&family=Press+Start+2P&family=Share+Tech+Mono&family=VT323&display=swap"
    />

    <!-- OpenDyslexic: only used by .dyslexic-text elements, load non-blocking -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/open-dyslexic-regular.css"
      integrity="sha384-Z+4lSRMBih0T8AB126p/ZLFsykHIs89GwPBrDpIb+cC5W5ppsL+yBh/Y0JDyzb8O"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      The EmailJS CDN script that used to live here has been removed. It was
      loaded on EVERY page — including /dashboard/login and the admin
      screens — from an unpinned major version with no SRI hash, while
      nothing in src/ referenced it (Contact.tsx uses mailto: links, not a
      form). A compromise of that package or of the CDN would have executed
      in the same origin as the dashboard session.
    -->
  </body>
</html>
